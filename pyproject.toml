[project]
name = "adventureworks-mcp-demo"
version = "0.1.0"
description = "A small read-only AdventureWorksLT MCP server for SQLDay"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp[cli]>=2,<3",
    "pyodbc>=5.2,<6",
    "sqlglot>=27,<31",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "httpx2>=2.13,<3", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
